<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Un tubo de muestra a media altura: lo que viaja en estos envíos. Arriba a
       la derecha, el punto de vigilancia. Mismo dibujo que
       herramientas/generar_iconos.py, que saca de aquí los PNG. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#g)"/>
  <!-- el vidrio -->
  <path d="M69 60v78a19 19 0 0 0 38 0V60" fill="none" stroke="#fff" stroke-width="9"
        stroke-linecap="round"/>
  <!-- el tapón -->
  <rect x="61" y="34" width="54" height="22" rx="7" fill="#fff"/>
  <!-- la muestra, con dos burbujas caladas -->
  <path fill="#fff" fill-rule="evenodd"
        d="M76.5 104h23v34a11.5 11.5 0 0 1-23 0z
           M79 121a3 3 0 1 0 6 0 3 3 0 1 0-6 0z
           M91.6 132a2.4 2.4 0 1 0 4.8 0 2.4 2.4 0 1 0-4.8 0z"/>
  <!-- el punto de vigilancia -->
  <path fill="#fff" fill-rule="evenodd"
        d="M137 54a15 15 0 1 0 30 0 15 15 0 1 0-30 0z
           M146 54a6 6 0 1 0 12 0 6 6 0 1 0-12 0z"/>
</svg>
