<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShipmentMonitor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="icon" href="icono-192.png" sizes="192x192" type="image/png">
<!-- iOS no lee el manifest para el icono de la pantalla de inicio -->
<link rel="apple-touch-icon" href="icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ShipmentMonitor">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<!-- Clave pública VAPID: la necesita el navegador para suscribirse a los avisos -->
<script src="push-config.js"></script>
<!-- Librerías servidas en local: la PWA funciona sin internet y sin depender de un CDN -->
<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<script src="vendor/babel.js"></script>
<style>
/* ───────────────────────── tipografía ─────────────────────────
   Inter variable, servida en local (sin CDN ni Google Fonts). */
@font-face{
  font-family:'Inter var';
  src:url('vendor/fuentes/inter-latin-wght-normal.woff2') format('woff2-variations');
  font-weight:100 900; font-style:normal; font-display:swap;
}
/* ───────────────────────── tokens ─────────────────────────
   Tema único: negro con los detalles en naranja. No depende del tema del
   sistema a propósito —antes había una versión clara y otra oscura—, así que
   el panel se ve igual en el móvil, en el escritorio y en la app instalada. */
:root{
  color-scheme: dark;                       /* barras de scroll y controles oscuros */

  --naranja:#f97316; --naranja-claro:#fb923c; --naranja-suave:#1c0e04; --naranja-borde:#7c2d12;
  --bg:#000000; --panel:#0c0c0c; --panel-2:#141414; --borde:#272727;
  --texto:#f5f5f4; --suave:#a1a1a0; --tenue:#6f6f6e;
  --ok:#4ade80; --ok-bg:#0a2415; --error:#fb7185; --error-bg:#2a1015; --info:#7dd3fc;
  --sombra:0 1px 2px rgba(0,0,0,.6), 0 12px 32px -20px rgba(0,0,0,1);

  --fuente:'Inter var',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sp-1:.25rem; --sp-2:.5rem; --sp-3:.75rem; --sp-4:1rem; --sp-5:1.5rem; --sp-6:2rem;
  --r-sm:8px; --r:12px; --r-lg:18px;
  --ancho:1180px;
}
/* ───────────────────────── base ───────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--texto);
  font:400 15px/1.55 var(--fuente);
  font-feature-settings:'cv05' 1,'ss01' 1;   /* formas más limpias de la l y la a */
  letter-spacing:-.006em;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--naranja);outline-offset:2px;border-radius:var(--r-sm)}

/* ───────────────────────── piezas ───────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);
  border:1px solid var(--borde);background:var(--panel);border-radius:var(--r-sm);
  padding:.5rem .9rem;cursor:pointer;font-weight:550;white-space:nowrap;
  transition:border-color .15s,background .15s,transform .05s;
}
.btn:hover{border-color:var(--naranja);color:var(--naranja)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.btn.primario{background:var(--naranja);border-color:var(--naranja);color:#0a0a0a}
.btn.primario:hover{background:var(--naranja-claro);border-color:var(--naranja-claro);color:#1c1917}
.btn.icono{padding:.5rem .6rem}
.btn.bloque{width:100%;padding:.7rem 1rem}

.campo{display:flex;flex-direction:column;gap:var(--sp-2)}
.campo label{font-size:.8rem;font-weight:600;color:var(--suave)}
.campo input{
  width:100%;padding:.65rem .8rem;border:1px solid var(--borde);border-radius:var(--r-sm);
  background:var(--panel-2);
}
.campo input:focus{outline:none;border-color:var(--naranja);box-shadow:0 0 0 3px var(--naranja-suave)}
.campo .pista{font-size:.75rem;color:var(--tenue)}

.chip{
  display:inline-flex;align-items:center;gap:.35rem;font-size:.75rem;font-weight:600;
  padding:.2rem .6rem;border-radius:999px;border:1px solid var(--borde);color:var(--suave);
  background:var(--panel);white-space:nowrap;
}
.chip.on{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-bg)}
.chip.alerta{color:var(--error);border-color:color-mix(in srgb,var(--error) 40%,transparent);background:var(--error-bg)}
.chip.marca{color:var(--naranja);border-color:var(--naranja-borde);background:var(--naranja-suave)}

.tarjeta{background:var(--panel);border:1px solid var(--borde);border-radius:var(--r-lg);box-shadow:var(--sombra)}
.pad{padding:var(--sp-4)}
.titulo-seccion{
  font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--tenue);
  font-weight:700;margin-bottom:var(--sp-3);
}

/* ───────────────────────── acceso ───────────────────────── */
.acceso{min-height:100dvh;display:grid;place-items:center;padding:var(--sp-5) var(--sp-4)}
.acceso-caja{width:min(100%,26rem);display:grid;gap:var(--sp-5);padding:var(--sp-6) var(--sp-5)}
.acceso-cabecera{display:grid;gap:var(--sp-2);justify-items:center;text-align:center}
.acceso-cabecera img{width:56px;height:56px}
.acceso-cabecera h1{font-size:1.4rem;letter-spacing:-.03em;font-weight:650}
.acceso-cabecera p{font-size:.9rem;color:var(--suave)}
.acceso form{display:grid;gap:var(--sp-4)}
.recordar{display:flex;gap:var(--sp-3);align-items:flex-start;cursor:pointer;
          background:var(--panel-2);border:1px solid var(--borde);border-radius:var(--r);padding:var(--sp-3)}
.recordar input{margin:.2rem 0 0;accent-color:var(--naranja);width:1.05rem;height:1.05rem;flex:none}
.recordar b{display:block;font-size:.9rem}
.recordar span{font-size:.78rem;color:var(--suave)}
.aviso{border-radius:var(--r);padding:var(--sp-3);font-size:.87rem;border:1px solid}
.aviso.mal{background:var(--error-bg);border-color:color-mix(in srgb,var(--error) 35%,transparent);color:var(--error)}
.aviso.info{background:var(--naranja-suave);border-color:var(--naranja-borde);color:var(--naranja)}

/* ───────────────────────── estructura ───────────────────────── */
.barra{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--panel) 92%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--borde);
}
.barra-int{
  max-width:var(--ancho);margin:0 auto;padding:var(--sp-3) var(--sp-4);
  display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;
}
.marca-app{display:flex;align-items:center;gap:var(--sp-2);min-width:0}
.marca-app img{width:28px;height:28px;flex:none}
.marca-app h1{font-size:1.05rem;font-weight:650;letter-spacing:-.03em;white-space:nowrap}
.crece{flex:1 1 auto;min-width:0}
.acciones{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}

/* En el móvil la barra se comía 138 px en tres líneas. Las cifras de la tira
   ya salen en el título de cada sección, así que ahí sobran, y todo lo demás
   entra apretado en la parte de arriba. */
@media (max-width:620px){
  .barra-int{padding:var(--sp-2) var(--sp-3);gap:var(--sp-2)}
  .barra-int .tira{display:none}
  .marca-app img{width:24px;height:24px}
  .marca-app h1{font-size:.98rem}
  .acciones .btn{padding:.32rem .7rem;font-size:.82rem}
  .contenido{padding:var(--sp-2) var(--sp-3) var(--sp-5)}
}

.contenido{max-width:var(--ancho);margin:0 auto;padding:var(--sp-3) var(--sp-4) var(--sp-5);
            display:grid;gap:var(--sp-3)}
.columnas{display:grid;gap:var(--sp-4);grid-template-columns:1fr}
@media (min-width:1024px){
  .columnas{grid-template-columns:minmax(0,2.4fr) minmax(17rem,1fr);align-items:start}
  .lateral{position:sticky;top:5rem}
}
.columnas>*{min-width:0}

.metricas{display:grid;gap:var(--sp-2);grid-template-columns:repeat(auto-fit,minmax(7.5rem,1fr))}
.metrica{display:grid;gap:.1rem;padding:var(--sp-3);background:var(--panel-2);border-radius:var(--r);border:1px solid var(--borde)}
.metrica span{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--tenue);font-weight:700}
.metrica b{font-size:1.25rem;font-weight:700;letter-spacing:-.03em;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.metrica small{font-size:.75rem;color:var(--suave)}

.filtros{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
.chips-filtro{display:flex;gap:var(--sp-2);min-width:0;max-width:100%}
.chips-filtro>*{flex:0 0 auto}
.filtros .buscador{flex:1 1 12rem;min-width:0;position:relative}
.filtros .buscador input{width:100%;padding:.5rem .8rem;border:1px solid var(--borde);
  border-radius:999px;background:var(--panel);}
.filtros .buscador input:focus{outline:none;border-color:var(--naranja)}
.filtro-btn{
  border:1px solid var(--borde);background:var(--panel);border-radius:999px;
  padding:.35rem .8rem;font-size:.83rem;font-weight:600;cursor:pointer;color:var(--suave);white-space:nowrap;
}
.filtro-btn.activo{background:var(--naranja);border-color:var(--naranja);color:#0a0a0a}
/* En pantallas estrechas los cuatro filtros y el buscador se llevaban dos
   líneas enteras y desordenadas. Aquí los filtros van en una tira que se
   desplaza a lo ancho —empezando por «Todos», no medio cortada— y el buscador
   debajo, más bajito. */
@media (max-width:620px){
  .filtros{flex-direction:column;align-items:stretch;gap:var(--sp-2);min-width:0}
  .chips-filtro{width:100%;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .chips-filtro::-webkit-scrollbar{display:none}
  /* En columna, el «flex:1 1 12rem» del buscador se interpreta como ALTO y
     dejaba una caja de 12rem. En vertical manda el contenido. */
  .filtros .buscador{flex:0 0 auto}
  .filtros .buscador input{padding:.35rem .75rem;font-size:.85rem}
}

/* ───────────────────────── envíos ───────────────────────── */
.rejilla{display:grid;gap:var(--sp-3);grid-template-columns:repeat(auto-fill,minmax(min(100%,17rem),1fr))}
.envio{display:flex;flex-direction:column;gap:var(--sp-2);padding:var(--sp-3);min-width:0}
.envio-cab{display:flex;gap:var(--sp-2);align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.envio-ref{font-size:1.05rem;font-weight:650;letter-spacing:-.02em;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.envio-sub{font-size:.82rem;color:var(--suave);overflow-wrap:anywhere}
.datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(5.4rem,1fr));gap:var(--sp-2) var(--sp-3)}
.dato span{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--tenue);font-weight:700}
.dato b{font-weight:550;font-size:.88rem;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}

/* diagrama de pasos: flex puro, sin posicionamiento absoluto → nunca se solapa */
.pasos{display:flex;align-items:flex-start;gap:.15rem;padding-top:var(--sp-1)}
.paso{flex:1 1 0;min-width:2.6rem;max-width:5rem;display:grid;justify-items:center;gap:.3rem;text-align:center}
.paso .bola{
  width:1.65rem;height:1.65rem;border-radius:50%;display:grid;place-items:center;
  border:2px solid var(--borde);background:var(--panel);font-size:.8rem;color:var(--tenue);flex:none;
}
.paso .etq{font-size:.62rem;line-height:1.2;color:var(--tenue);font-weight:600;overflow-wrap:anywhere}
.paso .cuando{font-size:.58rem;line-height:1.15;color:var(--tenue);font-variant-numeric:tabular-nums;
              white-space:nowrap;opacity:.85}
.paso.hecho .cuando,.paso.actual .cuando{color:var(--suave)}
.paso.hecho .bola{background:var(--naranja);border-color:var(--naranja);color:#0a0a0a}
.paso.hecho .etq{color:var(--suave)}
.paso.actual .bola{background:var(--panel);border-color:var(--naranja);color:var(--naranja);
                   box-shadow:0 0 0 4px var(--naranja-suave)}
.paso.actual .etq{color:var(--naranja)}
.paso.final .bola{background:var(--ok);border-color:var(--ok);color:#0a0a0a;box-shadow:0 0 0 4px var(--ok-bg)}
.paso.final .etq{color:var(--ok)}
.paso.incidencia .bola{border-color:var(--error);color:var(--error);box-shadow:0 0 0 4px var(--error-bg)}
.paso.incidencia .etq{color:var(--error)}
.linea{flex:1 1 auto;height:2px;min-width:.25rem;margin-top:.8rem;background:var(--borde);border-radius:2px}
.linea.hecha{background:var(--naranja)}

/* ruta del envío: de quién sale y a quién va, sin que se solape en móvil */
.ruta{display:grid;gap:var(--sp-1)}
.ruta-fila{display:grid;grid-template-columns:1.15rem 1fr;gap:var(--sp-2);align-items:baseline;min-width:0}
.ruta-fila .marca-ruta{font-size:.62rem;font-weight:800;color:var(--tenue);letter-spacing:.04em}
.ruta-fila b{font-weight:600;font-size:.84rem;overflow-wrap:anywhere;display:block}
.ruta-fila i{font-style:normal;font-size:.74rem;color:var(--tenue);overflow-wrap:anywhere;display:block}
/* recorrido: cada situación por la que ha pasado el envío, con su hora */
.recorrido{display:grid;gap:0}
.recorrido-item{display:grid;grid-template-columns:auto 1fr;gap:var(--sp-2);min-width:0}
.recorrido-hilo{display:grid;justify-items:center;gap:2px}
.recorrido-punto{width:.5rem;height:.5rem;border-radius:50%;background:var(--borde);margin-top:.32rem;flex:none}
.recorrido-item:first-child .recorrido-punto{background:var(--naranja);box-shadow:0 0 0 3px var(--naranja-suave)}
.recorrido-raya{width:2px;flex:1 1 auto;min-height:.9rem;background:var(--borde);border-radius:2px}
.recorrido-item:last-child .recorrido-raya{background:transparent}
.recorrido-texto{padding-bottom:var(--sp-2);min-width:0}
.recorrido-texto time{display:block;font-size:.68rem;color:var(--tenue);font-variant-numeric:tabular-nums}
.recorrido-texto b{font-weight:600;font-size:.82rem;overflow-wrap:anywhere;display:block}
.recorrido-texto span{font-size:.74rem;color:var(--tenue);overflow-wrap:anywhere}
.detalle{border-top:1px solid var(--borde);padding-top:var(--sp-3);display:grid;gap:var(--sp-3)}
.hist{display:grid;gap:var(--sp-2)}
.hist-item{display:flex;gap:var(--sp-2);font-size:.82rem}
.hist-item time{color:var(--tenue);flex:none;font-variant-numeric:tabular-nums}
.pie{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.enlace{background:none;border:0;padding:0;color:var(--naranja);font-size:.82rem;font-weight:600;cursor:pointer}

/* ───────────────────────── novedades ───────────────────────── */
.novedad{display:flex;gap:var(--sp-3);padding:var(--sp-3) 0;border-bottom:1px solid var(--borde);min-width:0}
.novedad:last-child{border-bottom:0;padding-bottom:0}
.novedad .marca{width:1.9rem;height:1.9rem;border-radius:50%;display:grid;place-items:center;flex:none;
  background:var(--naranja-suave);color:var(--naranja);font-size:.85rem;border:1px solid var(--naranja-borde)}
.novedad .txt{min-width:0}
.novedad b{font-size:.88rem;display:block;overflow-wrap:anywhere}
.novedad p{font-size:.82rem;color:var(--suave);overflow-wrap:anywhere}
.novedad time{font-size:.72rem;color:var(--tenue)}
.vacio{color:var(--tenue);font-size:.87rem;padding:var(--sp-3) 0;text-align:center}

/* ─────────── tarjeta de avisos push ─────────── */
.push{margin-bottom:0}
.push-linea{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap}
.push-txt{flex:1 1 14rem;min-width:0;font-size:.87rem;color:var(--suave);line-height:1.4}
.push-txt b{color:var(--texto);font-weight:650}
.push-txt small{display:block;font-size:.78rem;color:var(--tenue)}
@media (max-width:620px){
  .push{padding:var(--sp-3)}
  .push-txt small{display:none}      /* en el móvil, el titular basta */
  .push-linea{gap:var(--sp-2)}
}
.push h2{font-size:1rem;margin:0 0 var(--sp-2);display:flex;align-items:center;gap:var(--sp-2)}
.push p{margin:0 0 var(--sp-3);font-size:.87rem;color:var(--suave);line-height:1.55}
.push ol{margin:0 0 var(--sp-3);padding-left:1.15rem;font-size:.87rem;color:var(--suave);line-height:1.7}
.push ol code{background:var(--panel-2);border:1px solid var(--borde);border-radius:6px;
  padding:.05rem .35rem;font-size:.85em;color:var(--texto)}
.push .acciones-push{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center}
.push.hecho{display:flex;align-items:center;gap:var(--sp-2);font-size:.87rem;color:var(--suave)}
.push.hecho .punto{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.suscripcion{
  width:100%;box-sizing:border-box;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:.72rem;line-height:1.5;background:var(--panel-2);color:var(--texto);
  border:1px solid var(--borde);border-radius:var(--r);padding:var(--sp-3);
  min-height:5.5rem;resize:vertical;margin-bottom:var(--sp-3);word-break:break-all;
}

.pie-app{max-width:var(--ancho);margin:0 auto;padding:0 var(--sp-4) var(--sp-6);
         font-size:.75rem;color:var(--tenue);display:flex;gap:var(--sp-3);flex-wrap:wrap}
@media (max-width:520px){
  .barra-int{padding:var(--sp-3)}
  .contenido{padding:var(--sp-3)}
  .acciones{width:100%}
  .acciones .btn{flex:1 1 auto}
  .marca-app h1{font-size:.95rem}
}

/* ─────────────── jerarquía del panel ───────────────
   Lo que importa manda: primero los envíos que siguen en movimiento, después
   los que ya están cerrados y al final todo lo demás. Las secciones de abajo
   se pliegan para que no empujen a los envíos fuera de la pantalla. */
.seccion{display:grid;gap:var(--sp-2)}
.seccion-cab{
  display:flex;align-items:center;gap:var(--sp-2);width:100%;
  background:none;border:0;padding:var(--sp-1) 0;cursor:pointer;color:inherit;text-align:left;
}
.seccion-cab:not([aria-expanded]){cursor:default}
.seccion-cab h2{
  font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--tenue);
}
.seccion.primaria .seccion-cab h2{color:var(--naranja);font-size:.78rem}
.cuenta{
  font-size:.7rem;font-weight:700;color:var(--suave);background:var(--panel-2);
  border:1px solid var(--borde);border-radius:999px;padding:.05rem .5rem;font-variant-numeric:tabular-nums;
}
.seccion.primaria .cuenta{background:var(--naranja-suave);border-color:var(--naranja-borde);color:var(--naranja-claro)}
.flecha{margin-left:auto;color:var(--tenue);font-size:.7rem;transition:transform .18s ease}
.seccion-cab[aria-expanded="true"] .flecha{transform:rotate(90deg)}
.raya{flex:1 1 auto;height:1px;background:var(--borde);min-width:1rem}

/* Tira de cifras de la barra superior: lo mismo que las métricas, en una línea */
.tira{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;font-size:.78rem;color:var(--tenue)}
.tira b{font-variant-numeric:tabular-nums;font-weight:700}
.tira .dato-tira{display:flex;gap:.3rem;align-items:baseline;white-space:nowrap}
.tira .sep{opacity:.35}

/* Prueba de los avisos */
.prueba{display:grid;gap:var(--sp-2)}
.prueba-lista{display:grid;gap:.35rem;margin:0;padding:0;list-style:none}
.prueba-lista li{display:grid;grid-template-columns:1.1rem 1fr;gap:var(--sp-2);font-size:.83rem;align-items:baseline}
.prueba-lista .marca-ok{color:var(--ok);font-weight:700}
.prueba-lista .marca-mal{color:var(--error);font-weight:700}
.prueba-lista .marca-esp{color:var(--tenue)}
.prueba-lista small{display:block;color:var(--tenue);font-size:.75rem;overflow-wrap:anywhere}

/* ─────────────── pantalla de arranque ───────────────
   Un segundo con el icono dibujándose solo. No es adorno gratuito: la PWA
   tarda un instante en descifrar datos.json y, sin esto, se veía un fogonazo
   de página en blanco cada vez que se abría desde el icono del móvil. */
#arranque{
  position:fixed; inset:0; z-index:200; display:grid; place-items:center;
  background:var(--bg); transition:opacity .32s ease;
}
#arranque.fuera{opacity:0; pointer-events:none}
#arranque .marca{display:grid; justify-items:center; gap:var(--sp-4)}
#arranque svg{width:104px; height:104px; overflow:visible}
#arranque .nombre{
  font-size:.9rem; font-weight:650; letter-spacing:.14em; text-transform:uppercase;
  color:var(--tenue); animation:arr-entra .5s .45s both;
}
/* La caja se dibuja como si la trazara un lápiz */
#arranque .trazo{
  fill:none; stroke:var(--naranja); stroke-width:10; stroke-linecap:round; stroke-linejoin:round;
  stroke-dasharray:var(--largo); stroke-dashoffset:var(--largo);
  animation:arr-traza .78s cubic-bezier(.65,0,.35,1) forwards;
}
#arranque .trazo.interior{animation-delay:.2s}
#arranque .punto{transform-origin:150px 50px; animation:arr-punto .42s .58s cubic-bezier(.34,1.56,.64,1) both}
@keyframes arr-traza{to{stroke-dashoffset:0}}
@keyframes arr-punto{from{transform:scale(0)} to{transform:scale(1)}}
@keyframes arr-entra{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}

/* Quien haya pedido menos animación ve el icono quieto, sin trazado ni rebote */
@media (prefers-reduced-motion: reduce){
  #arranque .trazo{animation:none; stroke-dashoffset:0}
  #arranque .punto{animation:none}
  #arranque .nombre{animation:none}
}
</style>
</head>
<body>
<!-- Se pinta antes que React y se retira sola: ver #arranque en el <style>. -->
<div id="arranque" role="status" aria-label="Abriendo ShipmentMonitor">
  <div class="marca">
    <svg viewBox="0 0 192 192" aria-hidden="true">
      <path class="trazo" style="--largo:352" d="M96 42 150 68v56L96 150 42 124V68z"/>
      <path class="trazo interior" style="--largo:176" d="M42 68l54 26 54-26M96 94v56"/>
      <g class="punto">
        <circle cx="150" cy="50" r="17" fill="var(--naranja)"/>
        <circle cx="150" cy="50" r="7" fill="var(--bg)"/>
      </g>
    </svg>
    <div class="nombre">ShipmentMonitor</div>
  </div>
</div>
<div id="app"></div>
<script>
/* La animación dura 1 s justo. Si la app tarda más en montar, la pantalla se
   queda puesta hasta que esté lista: nunca se ve el panel a medio hacer. */
(function(){
  var desde = Date.now(), listo = false;
  window.cerrarArranque = function(){
    if (listo) return;
    listo = true;
    setTimeout(function(){
      var e = document.getElementById('arranque');
      if (!e) return;
      e.classList.add('fuera');
      setTimeout(function(){ e.remove(); }, 400);
    }, Math.max(0, 1000 - (Date.now() - desde)));
  };
  // Red de seguridad: si algo fallara al montar, no dejamos la pantalla clavada.
  setTimeout(window.cerrarArranque, 6000);
})();
</script>
<script type="text/babel">
const {useState, useEffect, useCallback, useRef, Fragment} = React;

/* ─────────────────── datos ───────────────────
   No hay servidor: el panel descarga docs/datos.json (que publica el workflow
   de GitHub Actions) y lo descifra aquí mismo con WebCrypto. */

const CLAVE_GUARDADA = 'monitor-envios:clave';
const ULTIMO_VISTO   = 'monitor-envios:ultimo-evento';

const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} };
const leer    = k      => { try { return localStorage.getItem(k); } catch (_) { return null; } };
const olvidar = k      => { try { localStorage.removeItem(k); } catch (_) {} };

const deB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

/* ─────────────────── avisos push ───────────────────
   El aviso llega desde GitHub Actions al servicio de push del propio navegador
   y de ahí al móvil, con la app cerrada. Sin Telegram, sin correo y sin
   servidor: lo único que hay que hacer una vez por dispositivo es pegar la
   suscripción que sale aquí en el Secret PUSH_SUSCRIPCIONES del repositorio. */

const PUSH_PEGADA = 'monitor-envios:push-pegada';   // endpoint que ya está en el Secret

const b64uAbytes = b64 => {
  const base = (b64 + '='.repeat((4 - b64.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/');
  return Uint8Array.from(atob(base), c => c.charCodeAt(0));
};

const esIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

const instalada = () => window.matchMedia('(display-mode: standalone)').matches ||
  window.navigator.standalone === true;

const pushSoportado = () =>
  'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

/** Deja solo lo que necesita el workflow; el resto (expirationTime) sobra. */
const comoTexto = sus => {
  const j = sus.toJSON();
  return JSON.stringify({endpoint: j.endpoint, keys: {p256dh: j.keys.p256dh, auth: j.keys.auth}});
};

async function suscripcionActual(){
  if (!pushSoportado()) return null;
  const reg = await navigator.serviceWorker.ready;
  return reg.pushManager.getSubscription();
}

async function suscribir(){
  if (!window.VAPID_PUBLICA) {
    throw new Error('Falta la clave pública en push-config.js. Genera el par VAPID con ' +
                    '«python -m monitor.webpush --generar-claves».');
  }
  const permiso = await Notification.requestPermission();
  if (permiso !== 'granted') {
    throw new Error(permiso === 'denied'
      ? 'Has bloqueado las notificaciones para esta página. Habilítalas en los ajustes del navegador y vuelve a intentarlo.'
      : 'Hace falta permiso para poder avisarte.');
  }
  const reg = await navigator.serviceWorker.ready;
  const opciones = {userVisibleOnly: true, applicationServerKey: b64uAbytes(window.VAPID_PUBLICA)};
  try {
    return await reg.pushManager.subscribe(opciones);
  } catch (err) {
    // Suele pasar al regenerar las claves VAPID: la suscripción vieja estorba.
    const vieja = await reg.pushManager.getSubscription();
    if (!vieja) throw err;
    await vieja.unsubscribe();
    return reg.pushManager.subscribe(opciones);
  }
}

async function copiar(texto){
  try { await navigator.clipboard.writeText(texto); return true; }
  catch (_) { return false; }
}

/* Al pegar la contraseña en la caja de Secrets de GitHub es facilísimo colar un
   Intro o un espacio sin verlo, y en el móvil el teclado añade espacios solo.
   Si el fichero se cifró con «clave\n» y aquí escribes «clave», la clave
   derivada es otra y el panel rechazaría la contraseña correcta.

   Por eso no probamos una sola forma: probamos la recortada y las variantes
   «sucias» habituales, igual que hace monitor/estado.py al cargar el fichero.
   Un fichero publicado por una versión anterior sigue así abriéndose. */
const limpiar = pw => (pw || '').trim();

function variantesDeClave(pw){
  const base = limpiar(pw);
  const posibles = [base, pw, base + '\n', base + '\r\n', base + ' ', ' ' + base];
  return posibles.filter((v, i) => v && posibles.indexOf(v) === i);
}

async function descifrar(sobre, password){
  const material = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const clave = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: deB64(sobre.salt), iterations: sobre.iter || 200000, hash:'SHA-256'},
    material, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const claro = await crypto.subtle.decrypt(
    {name:'AES-GCM', iv: deB64(sobre.iv)}, clave, deB64(sobre.datos));
  return JSON.parse(new TextDecoder().decode(claro));
}

async function descifrarTolerante(sobre, password){
  for (const candidata of variantesDeClave(password)){
    try { return await descifrar(sobre, candidata); }
    catch (_) { /* probamos la siguiente */ }
  }
  const e = new Error('contraseña incorrecta');
  e.clave = true;
  throw e;
}

/* De dónde se bajan los datos.
 *
 * Del repositorio, no de la copia que sirve GitHub Pages. Antes valía la copia
 * de Pages porque el workflow desplegaba en cada comprobación; ahora una sola
 * ejecución cubre horas —comprueba, guarda y se vuelve a dormir— y Pages solo
 * se despliega al cerrar la jornada. Leyendo del repositorio, el panel ve cada
 * comprobación en cuanto se guarda.
 *
 * Si el repositorio no contesta (sin conexión, o alguien que abre el panel de
 * otra copia), se cae con elegancia a la copia local de siempre.
 */
const REPO_DATOS = 'https://raw.githubusercontent.com/SILAB3D/SHIPMENTMONITOR/main/'
                 + 'monitor-envios-github/monitor-envios-nube/docs/datos.json';

async function bajarSobre(){
  for (const url of [REPO_DATOS, 'datos.json']) {
    try {
      const r = await fetch(url + '?t=' + Date.now(), {cache: 'no-store'});
      if (r.ok) return await r.json();
    } catch (_) { /* probamos el siguiente */ }
  }
  throw new Error('no se pudieron descargar los datos (¿ha corrido ya el workflow?)');
}

async function cargarDatos(password){
  const sobre = await bajarSobre();
  if (!sobre.datos) return sobre;                 // fichero en claro (modo demo)
  return descifrarTolerante(sobre, password);
}

/* ─────────────────── utilidades ─────────────────── */
const fmtFecha = iso => iso
  ? new Date(iso).toLocaleString('es-ES', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'})
  : '—';

function haceCuanto(iso){
  if (!iso) return 'nunca';
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 1) return 'hace un momento';
  if (min < 60) return `hace ${min} min`;
  const h = Math.round(min / 60);
  if (h < 24) return `hace ${h} h`;
  return `hace ${Math.round(h / 24)} d`;
}

const sinAcentos = t => (t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

/* Los campos se guardan con nombre de máquina para que el código sea estable;
   aquí se traducen al enseñarlos. Lo que no esté en la tabla sale tal cual. */
const ETIQUETAS = {
  referencia:'Referencia', fecha:'Fecha de alta', estado:'Estado actual',
  fecha_estado:'Último movimiento', destinatario:'Destinatario', localidad:'Población destino',
  remitente:'Remitente', localidad_origen:'Población origen', cp_origen:'C.P. origen',
  ref_cliente:'Tu referencia', bultos:'Bultos', kilos:'Kilos',
  observaciones:'Observaciones', entrega:'Entregado el',
};
const etiqueta = k => ETIQUETAS[k] || k.replace(/_/g, ' ');

const PASOS = [
  {etq:'Grabado',   icono:'1'},
  {etq:'Tránsito',  icono:'2'},
  {etq:'Reparto',   icono:'3'},
  {etq:'Entrega',   icono:'✓'},
];

/** Traduce el texto de estado del portal a una posición del diagrama.
 *
 * El orden de las comprobaciones importa mucho, y no es el intuitivo:
 * DinaPaqWeb llama «PENDIENTE DE ENTREGAR A TIPSA» al primer paso de todos.
 * Buscar «entreg» lo primero colocaba ese estado —y el envío entero— en
 * «Entregado» nada más grabarse. Por eso los estados iniciales se descartan
 * antes que nada.
 *
 * Los textos que llegan son de dos sitios: el listado usa mayúsculas secas
 * (TRANSITO, REPARTO, ENTREGADO) y el detalle nombres llanos (Documentado,
 * En camino, En reparto, Entregado), además de las lecturas de almacén
 * («LECTURA EN HUB MADRID», «LEIDO EN DESTINO»). Aquí caben todos.
 */
function analizarEstado(texto){
  const t = sinAcentos(texto);
  // «Entrega parcial» cuenta como incidencia: ha llegado, pero no entero.
  const incidencia = /incid|ausen|rehus|devuel|falt|error|retenid|aduan|direccion erronea|no localiz|extravi|siniestr|anulad|parcial|mal clasificad/.test(t);
  let paso;
  if (/pendiente de entregar|pendiente de recogida|grabad|registrad|documentad|admitid|preparad|\balta\b/.test(t)) paso = 0;
  else if (/entregad|entrega realizada|entrega parcial/.test(t)) paso = 3;
  else if (/reparto|en entrega|ultima milla/.test(t)) paso = 2;
  else if (/transit|en camino|en ruta|\bhub\b|almacen|agencia|lectura|leido|recogid|salida|llegada|expedid|plataforma|delegacion/.test(t)) paso = 1;
  else if (incidencia) paso = 2;
  else paso = 0;
  return {paso, incidencia, texto: texto || 'sin estado'};
}

/* El portal escribe las horas como «27/08/26 08:20:25». En el diagrama no cabe
   tanto, así que se recorta a día y hora; en el recorrido se deja entera. */
function horaCorta(marca){
  if (!marca) return '';
  const m = String(marca).match(/^(\d{1,2}\/\d{1,2})(?:\/\d{2,4})?(?:[ T](\d{1,2}:\d{2}))?/);
  if (!m) return String(marca);
  return m[2] ? `${m[1]} ${m[2]}` : m[1];
}

/** Para cada paso del diagrama, cuándo se alcanzó por primera vez.
 *  `pasos` viene del portal en orden cronológico, así que la primera situación
 *  que cae en un paso es la que lo estrenó. */
function horasDePasos(pasos){
  const horas = new Array(PASOS.length).fill(null);
  for (const p of pasos || []){
    const {paso} = analizarEstado(p.estado);
    if (horas[paso] == null) horas[paso] = p.ts;
  }
  return horas;
}

/* ─────────────────── acceso ─────────────────── */
function Acceso({onEntrar}){
  const [password, setPassword] = useState('');
  const [recordar, setRecordar] = useState(true);
  const [error, setError] = useState('');
  const [cargando, setCargando] = useState(false);

  const enviar = async e => {
    e.preventDefault();
    setError(''); setCargando(true);
    try{
      const datos = await cargarDatos(password);
      if (recordar) guardar(CLAVE_GUARDADA, password); else olvidar(CLAVE_GUARDADA);
      onEntrar(password, datos);
    }catch(err){
      setError(err.clave ? 'Esa no es la contraseña del panel.' : err.message);
    }finally{ setCargando(false); }
  };

  return (
    <div className="acceso">
      <div className="tarjeta acceso-caja">
        <div className="acceso-cabecera">
          <img src="icono.svg" alt="" />
          <h1>ShipmentMonitor</h1>
          <p>Introduce la contraseña del panel para ver tus envíos</p>
        </div>
        <form onSubmit={enviar}>
          <div className="campo">
            <label htmlFor="pw">Contraseña del panel</label>
            <input id="pw" type="password" value={password} onChange={e=>setPassword(e.target.value)}
                   autoComplete="current-password" autoFocus required />
            <span className="pista">
              Es el valor del Secret <code>CLAVE_PANEL</code> del repositorio. Los datos viajan
              cifrados y se descifran aquí, en tu navegador.
            </span>
          </div>
          <label className="recordar">
            <input type="checkbox" checked={recordar} onChange={e=>setRecordar(e.target.checked)} />
            <span>
              <b>Recordar en este dispositivo</b>
              <span>No tendrás que volver a escribirla en este navegador. Las credenciales del
                    portal viven en GitHub, nunca aquí.</span>
            </span>
          </label>
          {error && <div className="aviso mal">{error}</div>}
          <button className="btn primario bloque" type="submit" disabled={cargando}>
            {cargando ? 'Abriendo…' : 'Entrar'}
          </button>
        </form>
      </div>
    </div>
  );
}

/* ─────────────────── diagrama ─────────────────── */
function Diagrama({estado, pasos}){
  const {paso, incidencia} = analizarEstado(estado);
  const horas = horasDePasos(pasos);
  return (
    <div className="pasos" role="img" aria-label={`Estado: ${estado || 'desconocido'}`}>
      {PASOS.map((p, i) => {
        const entregado = paso === PASOS.length - 1 && !incidencia;
        const hecho = i < paso || (i === paso && entregado);
        const clases = ['paso'];
        if (hecho) clases.push('hecho');
        if (i === paso) clases.push('actual');
        if (i === paso && entregado) clases.push('final');
        if (i === paso && incidencia) clases.push('incidencia');
        return (
          <Fragment key={p.etq}>
            {i > 0 && <div className={'linea' + (i <= paso ? ' hecha' : '')} />}
            <div className={clases.join(' ')}>
              <div className="bola">{i === paso && incidencia ? '!' : (hecho ? '✓' : p.icono)}</div>
              <div className="etq">{p.etq}</div>
              {horas[i] && <div className="cuando">{horaCorta(horas[i])}</div>}
            </div>
          </Fragment>
        );
      })}
    </div>
  );
}

/* ─────────────────── tarjeta de envío ─────────────────── */
function TarjetaEnvio({envio, historial}){
  const [abierto, setAbierto] = useState(false);
  const c = envio.campos || {};
  const {incidencia} = analizarEstado(c.estado);
  const extras = Object.entries(c).filter(([k]) => k.startsWith('extra:'));

  // De dónde viene: población de origen y, si la hay, su código postal
  const procedencia = [c.localidad_origen, c.cp_origen].filter(Boolean).join(' · ');

  // El recorrido detallado del portal; los hitos son su versión resumida.
  const recorrido = envio.pasos || [];
  // Para el diagrama valen los hitos («Documentado», «En camino»…) porque
  // marcan justo los cuatro pasos. Si no los hay, se deducen del recorrido; y
  // si tampoco, queda el estado actual del listado, como hasta ahora.
  const pasosDelDiagrama = (envio.hitos && envio.hitos.length) ? envio.hitos : recorrido;

  return (
    <article className="tarjeta envio">
      <header className="envio-cab">
        <div style={{minWidth:0}}>
          <div className="envio-ref">{envio.id}</div>
          <div className="envio-sub">{c.destinatario || 'Sin destinatario'}{c.localidad ? ` · ${c.localidad}` : ''}</div>
        </div>
        <span className={'chip ' + (incidencia ? 'alerta' : 'marca')}>{c.estado || 'sin estado'}</span>
      </header>

      <Diagrama estado={c.estado} pasos={pasosDelDiagrama} />

      {/* De dónde sale y a dónde va, que es lo primero que se mira */}
      {(c.remitente || c.destinatario) && (
        <div className="ruta">
          <div className="ruta-fila">
            <span className="marca-ruta">DE</span>
            <div style={{minWidth:0}}>
              <b>{c.remitente || '—'}</b>
              {procedencia && <i>{procedencia}</i>}
            </div>
          </div>
          <div className="ruta-fila">
            <span className="marca-ruta">A</span>
            <div style={{minWidth:0}}>
              <b>{c.destinatario || '—'}</b>
              {c.localidad && <i>{c.localidad}</i>}
            </div>
          </div>
        </div>
      )}

      <div className="datos">
        {c.fecha && <div className="dato"><span>Fecha</span><b>{c.fecha}</b></div>}
        {c.bultos && <div className="dato"><span>Bultos</span><b>{c.bultos}</b></div>}
        {c.kilos && <div className="dato"><span>Kilos</span><b>{c.kilos}</b></div>}
        {c.entrega && <div className="dato"><span>Entrega</span><b>{c.entrega}</b></div>}
      </div>

      {c.observaciones && <div className="envio-sub">📝 {c.observaciones}</div>}

      <div className="pie">
        <span className="envio-sub">Visto {haceCuanto(envio.visto_ultima)}</span>
        <button className="enlace" onClick={()=>setAbierto(a=>!a)} aria-expanded={abierto}>
          {abierto ? 'Ocultar detalle' : 'Ver detalle'}
        </button>
      </div>

      {abierto && (
        <div className="detalle">
          <div>
            <div className="titulo-seccion">Todos los datos</div>
            <div className="datos">
              {Object.entries(c).filter(([k]) => !k.startsWith('extra:')).map(([k,v]) => (
                <div className="dato" key={k}><span>{etiqueta(k)}</span><b>{v || '—'}</b></div>
              ))}
              {extras.map(([k,v]) => (
                <div className="dato" key={k}><span>{k.slice(6)}</span><b>{v || '—'}</b></div>
              ))}
            </div>
          </div>
          {recorrido.length > 0 && (
            <div>
              <div className="titulo-seccion">Recorrido en el portal</div>
              <div className="recorrido">
                {recorrido.slice().reverse().map((s, i) => (
                  <div className="recorrido-item" key={`${s.ts}-${i}`}>
                    <div className="recorrido-hilo">
                      <div className="recorrido-punto" />
                      <div className="recorrido-raya" />
                    </div>
                    <div className="recorrido-texto">
                      <time>{s.ts}</time>
                      <b>{s.estado}</b>
                      {s.lugar && <span>{s.lugar}</span>}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
          <div>
            <div className="titulo-seccion">Cambios detectados</div>
            <div className="hist">
              {historial.length === 0 && <div className="envio-sub">Sin cambios registrados todavía.</div>}
              {historial.map(h => (
                <div className="hist-item" key={h.id}>
                  <time>{fmtFecha(h.ts)}</time><span>{h.detalle}</span>
                </div>
              ))}
              <div className="hist-item">
                <time>{fmtFecha(envio.visto_primera)}</time><span>detectado por primera vez</span>
              </div>
            </div>
          </div>
        </div>
      )}
    </article>
  );
}

/* ─────────────────── paneles ─────────────────── */
/* ─────────────────── tarjeta de avisos push ─────────────────── */
function AvisosPush({repo, meta}){
  const [sus, setSus]       = useState(null);      // suscripción viva en este navegador
  const [pegada, setPegada] = useState(() => leer(PUSH_PEGADA) || '');
  const [error, setError]   = useState('');
  const [ocupado, setOcupado] = useState(false);
  const [copiado, setCopiado] = useState(false);
  const [oculta, setOculta]   = useState(false);
  // ¿El repositorio ya conoce a este dispositivo? Lo dicen las huellas que
  // publica el monitor: si la nuestra está, no hay nada que pegar y la tarjeta
  // sobra, aunque este navegador no recuerde haberlo hecho.
  const [dadoDeAlta, setDadoDeAlta] = useState(false);

  useEffect(() => {
    const altas = meta && meta.push_dispositivos;
    if (!sus || !Array.isArray(altas)) { setDadoDeAlta(false); return; }
    let vivo = true;
    huellaDe(sus.endpoint).then(h => { if (vivo) setDadoDeAlta(altas.includes(h)); }).catch(() => {});
    return () => { vivo = false; };
  }, [sus, meta]);

  useEffect(() => {
    suscripcionActual().then(setSus).catch(() => {});
    // El service worker avisa si el navegador rota la suscripción por su cuenta.
    const alMensaje = ev => {
      if (ev.data && ev.data.tipo === 'suscripcion-renovada') suscripcionActual().then(setSus);
    };
    navigator.serviceWorker?.addEventListener('message', alMensaje);
    return () => navigator.serviceWorker?.removeEventListener('message', alMensaje);
  }, []);

  const activar = async () => {
    setOcupado(true); setError('');
    try { setSus(await suscribir()); }
    catch (e) { setError(e.message); }
    finally { setOcupado(false); }
  };

  const texto = sus ? comoTexto(sus) : '';
  const alDia = sus && (dadoDeAlta || pegada === sus.endpoint);
  const urlSecrets = repo ? `https://github.com/${repo}/settings/secrets/actions` : null;

  /* iOS solo deja suscribirse si la app está instalada en la pantalla de inicio. */
  if (esIOS() && !instalada()) {
    return (
      <div className="tarjeta pad push">
        <h2>📲 Instala la app para recibir avisos</h2>
        <p>
          En iPhone y iPad las notificaciones solo funcionan con la aplicación instalada
          (iOS&nbsp;16.4 o superior). En Safari, toca <strong>Compartir</strong> y luego
          <strong> Añadir a pantalla de inicio</strong>. Abre después el icono que aparecerá
          y vuelve aquí para activar los avisos.
        </p>
      </div>
    );
  }

  if (!pushSoportado()) {
    return (
      <div className="tarjeta pad push">
        <h2>Avisos no disponibles en este navegador</h2>
        <p>
          Este navegador no admite notificaciones push. Abre el panel en Chrome, Edge, Firefox
          o Safari, o instálalo como aplicación. Los envíos y las novedades se ven igual aquí.
        </p>
      </div>
    );
  }

  if (alDia && !oculta) {
    return (
      <div className="tarjeta pad push hecho">
        <span className="punto" />
        <span>Avisos activos en este dispositivo.</span>
        <div className="crece" />
        <button className="btn" onClick={() => setOculta(true)}>Ocultar</button>
        <button className="btn" onClick={() => { olvidar(PUSH_PEGADA); setPegada(''); }}>
          Ver la suscripción
        </button>
      </div>
    );
  }
  if (alDia || oculta) return null;

  return (
    <div className="tarjeta pad push">
      {!sus ? (
        <Fragment>
          {/* Una sola línea: esta tarjeta no puede empujar los envíos fuera de
              la pantalla, que es a lo que se viene. */}
          <div className="push-linea">
            <span className="push-txt">
              🔔 <b>Recibe los avisos en este dispositivo</b>
              <small>Te avisa de envíos nuevos y cambios de estado con la app cerrada.</small>
            </span>
            <button className="btn primario" onClick={activar} disabled={ocupado}>
              {ocupado ? 'Activando…' : 'Activar avisos'}
            </button>
            <button className="enlace" onClick={() => setOculta(true)} title="Ocultar hasta la próxima visita">
              Ahora no
            </button>
          </div>
          {error && <div className="aviso mal" style={{marginTop:'.6rem'}}>{error}</div>}
        </Fragment>
      ) : (
        <Fragment>
          <h2>🔑 Un último paso, solo esta vez</h2>
          <p>
            Este dispositivo ya está suscrito. Para que GitHub Actions pueda empujarte los avisos,
            copia este texto y guárdalo en el Secret <code>PUSH_SUSCRIPCIONES</code> del repositorio.
            Si ya hay otro dispositivo dentro, pega el nuevo <strong>debajo</strong> del anterior.
          </p>
          <textarea className="suscripcion" readOnly value={texto}
                    onFocus={e => e.target.select()} aria-label="Suscripción para el Secret" />
          <ol>
            <li>Copia el texto de arriba.</li>
            <li>
              Abre {urlSecrets
                ? <a className="enlace" href={urlSecrets} target="_blank" rel="noopener">Settings → Secrets → Actions</a>
                : <span>Settings → Secrets and variables → Actions</span>} en tu repositorio.
            </li>
            <li>Crea o edita el secret <code>PUSH_SUSCRIPCIONES</code> y pégalo.</li>
            <li>Vuelve aquí y pulsa «Ya lo he pegado».</li>
          </ol>
          <div className="acciones-push">
            <button className="btn primario" onClick={async () => {
              setCopiado(await copiar(texto));
              setTimeout(() => setCopiado(false), 2500);
            }}>{copiado ? '¡Copiado!' : 'Copiar'}</button>
            <button className="btn" onClick={() => { guardar(PUSH_PEGADA, sus.endpoint); setPegada(sus.endpoint); }}>
              Ya lo he pegado
            </button>
          </div>
        </Fragment>
      )}
    </div>
  );
}

/* ─────────────────── secciones plegables ───────────────────
   El panel tiene un orden de importancia: los envíos activos arriba y del todo
   abiertos, los cerrados debajo, y lo demás plegado. Así lo que se mira todos
   los días entra en pantalla sin desplazarse. */
function Seccion({titulo, cuenta, primaria, abiertaPorDefecto = true, plegable = true, children}){
  const [abierta, setAbierta] = useState(abiertaPorDefecto);
  const cuerpo = <div>{children}</div>;
  if (!plegable) {
    return (
      <section className={'seccion' + (primaria ? ' primaria' : '')}>
        <div className="seccion-cab">
          <h2>{titulo}</h2>
          {cuenta != null && <span className="cuenta">{cuenta}</span>}
          <span className="raya" />
        </div>
        {cuerpo}
      </section>
    );
  }
  return (
    <section className={'seccion' + (primaria ? ' primaria' : '')}>
      <button className="seccion-cab" aria-expanded={abierta} onClick={() => setAbierta(a => !a)}>
        <h2>{titulo}</h2>
        {cuenta != null && <span className="cuenta">{cuenta}</span>}
        <span className="raya" />
        <span className="flecha">▶</span>
      </button>
      {abierta && cuerpo}
    </section>
  );
}

/* ─────────────────── prueba de los avisos ───────────────────
   Comprueba, uno por uno, los eslabones de la cadena que lleva un aviso desde
   GitHub hasta esta pantalla. El único que no se puede probar desde aquí es el
   propio envío desde GitHub Actions —haría falta una clave del repositorio, y
   esta página es pública—, así que para ese se ofrece el enlace que lo lanza. */
const PASOS_PRUEBA = [
  ['permiso',  'Permiso de notificaciones'],
  ['sw',       'Service worker activo'],
  ['sub',      'Suscripción push válida'],
  ['alta',     'Este dispositivo está dado de alta en el repositorio'],
  ['pantalla', 'El aviso se ve en pantalla'],
];

async function huellaDe(endpoint){
  const bytes = new TextEncoder().encode(endpoint);
  const resumen = await crypto.subtle.digest('SHA-256', bytes);
  return [...new Uint8Array(resumen)].map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 16);
}

function PruebaAvisos({meta}){
  const [estado, setEstado] = useState(null);      // {clave: {ok, nota}}
  const [probando, setProbando] = useState(false);

  const probar = async () => {
    setProbando(true);
    const r = {};
    const anota = (k, ok, nota) => { r[k] = {ok, nota}; setEstado({...r}); };
    try {
      if (typeof Notification === 'undefined') {
        anota('permiso', false, 'Este navegador no admite notificaciones.');
        setProbando(false); return;
      }
      let permiso = Notification.permission;
      if (permiso === 'default') permiso = await Notification.requestPermission();
      anota('permiso', permiso === 'granted',
            permiso === 'granted' ? 'Concedido'
            : permiso === 'denied' ? 'Bloqueado. Hay que permitirlo en los ajustes del sitio.'
            : 'Sin responder.');
      if (permiso !== 'granted') { setProbando(false); return; }

      const reg = await navigator.serviceWorker?.getRegistration();
      anota('sw', !!(reg && reg.active), reg ? 'Registrado' : 'No hay service worker: recarga la página.');
      if (!reg) { setProbando(false); return; }

      const sub = await reg.pushManager.getSubscription();
      anota('sub', !!sub, sub ? new URL(sub.endpoint).host
                              : 'Sin suscripción: pulsa «Activar avisos» más arriba.');

      if (sub) {
        const huella = await huellaDe(sub.endpoint);
        const altas = meta?.push_dispositivos;
        if (!Array.isArray(altas)) {
          anota('alta', null, 'La última comprobación es anterior a esta versión; se sabrá en la siguiente.');
        } else if (altas.includes(huella)) {
          anota('alta', true, `Sí, entre los ${altas.length} dispositivo(s) del Secret PUSH_SUSCRIPCIONES.`);
        } else {
          anota('alta', false, 'No. Copia el texto de la suscripción en el Secret PUSH_SUSCRIPCIONES.');
        }
      }

      await reg.showNotification('✅ Los avisos funcionan', {
        body: 'Prueba lanzada desde el panel. Si estás leyendo esto en una notificación, este dispositivo está listo.',
        icon: 'icono-notificacion-192.png', badge: 'icono-badge-96.png',
        tag: 'prueba-panel', renotify: true,
      });
      anota('pantalla', true, 'Enviado. Debería haber aparecido ahora mismo.');
    } catch (e) {
      setEstado(es => ({...(es || {}), error: {ok: false, nota: String(e && e.message || e)}}));
    }
    setProbando(false);
  };

  const marca = v => v?.ok === true ? <span className="marca-ok">✓</span>
                   : v?.ok === false ? <span className="marca-mal">✗</span>
                   : <span className="marca-esp">·</span>;

  return (
    <div className="prueba">
      <div className="envio-sub">
        Comprueba de un vistazo los eslabones que llevan un aviso hasta esta pantalla.
      </div>
      <div className="acciones">
        <button className="btn primario" onClick={probar} disabled={probando}>
          {probando ? 'Probando…' : 'Probar los avisos'}
        </button>
        {meta?.repo && (
          <a className="btn" target="_blank" rel="noopener"
             href={`https://github.com/${meta.repo}/actions/workflows/monitor.yml`}>
            Prueba completa desde GitHub
          </a>
        )}
      </div>
      {estado && (
        <ul className="prueba-lista">
          {PASOS_PRUEBA.map(([k, texto]) => (
            <li key={k}>
              {marca(estado[k])}
              <div>{texto}{estado[k]?.nota && <small>{estado[k].nota}</small>}</div>
            </li>
          ))}
          {estado.error && (
            <li><span className="marca-mal">✗</span><div>Algo falló<small>{estado.error.nota}</small></div></li>
          )}
        </ul>
      )}
      <div className="envio-sub" style={{fontSize:'.75rem'}}>
        El último eslabón —que GitHub Actions consiga empujar el aviso— solo se puede
        probar desde el propio GitHub: usa «Run workflow» marcando la casilla de prueba.
      </div>
    </div>
  );
}

function Metricas({meta, envios}){
  const analizados = envios.map(e => analizarEstado(e.campos.estado));
  const entregados = analizados.filter(a => a.paso === 3 && !a.incidencia).length;
  const incidencias = analizados.filter(a => a.incidencia).length;
  const enCurso = envios.length - entregados - incidencias;
  return (
    <section className="metricas">
      <div className="metrica"><span>Vigilados</span><b>{envios.length}</b></div>
      <div className="metrica"><span>En curso</span><b style={{color:'var(--naranja)'}}>{enCurso}</b></div>
      <div className="metrica"><span>Entregados</span><b style={{color:'var(--ok)'}}>{entregados}</b></div>
      <div className="metrica"><span>Incidencias</span><b style={{color: incidencias ? 'var(--error)' : 'inherit'}}>{incidencias}</b></div>
      <div className="metrica">
        <span>Última comprobación</span>
        <b style={{fontSize:'1rem'}}>{haceCuanto(meta?.ultima_comprobacion)}</b>
        <small>{fmtFecha(meta?.ultima_comprobacion)}</small>
      </div>
    </section>
  );
}

function Novedades({eventos}){
  return (
    <section className="tarjeta pad">
      <div className="titulo-seccion">Novedades</div>
      {eventos.length === 0 && <div className="vacio">Todo tranquilo por aquí.</div>}
      {eventos.slice(0, 25).map(ev => (
        <div className="novedad" key={ev.id}>
          <div className="marca">{ev.tipo === 'nuevo' ? '+' : '↻'}</div>
          <div className="txt">
            <b>{ev.titulo}</b>
            <p>{ev.detalle}</p>
            <time>{fmtFecha(ev.ts)}</time>
          </div>
        </div>
      ))}
    </section>
  );
}

/* ─────────────────── panel ─────────────────── */
function Panel({datos, onRecargar, onSalir, recargando}){
  const [filtro, setFiltro] = useState('todos');
  const [busqueda, setBusqueda] = useState('');
  const [permiso, setPermiso] = useState(typeof Notification !== 'undefined' ? Notification.permission : 'denied');

  const meta = datos.meta || {};
  const eventos = datos.eventos || [];
  const envios = Object.entries(datos.envios || {})
    .map(([id, e]) => ({id, ...e}))
    .sort((a, b) => (b.visto_primera || '').localeCompare(a.visto_primera || ''));

  // Red de seguridad: si el panel está abierto y ve novedades que el push no
  // llegó a entregar, las enseña igualmente. El «tag» evita duplicados.
  useEffect(() => {
    if (permiso !== 'granted' || !eventos.length) return;
    const visto = Number(leer(ULTIMO_VISTO) || 0);
    const nuevos = eventos.filter(e => e.id > visto);
    guardar(ULTIMO_VISTO, String(Math.max(...eventos.map(e => e.id))));
    if (!visto) return;                       // primera visita: no bombardeamos
    (async () => {
      const reg = await navigator.serviceWorker?.getRegistration();
      nuevos.slice(0, 5).forEach(n => {
        const o = {body:n.detalle, icon:'icono-192.png', badge:'icono-192.png', tag:'envio-'+n.envio_id};
        reg ? reg.showNotification(n.titulo, o) : new Notification(n.titulo, o);
      });
    })();
  }, [eventos, permiso]);

  const q = busqueda.trim().toLowerCase();
  const visibles = envios.filter(e => {
    const a = analizarEstado(e.campos.estado);
    if (filtro === 'curso' && (a.paso === 3 || a.incidencia)) return false;
    if (filtro === 'entregados' && (a.paso !== 3 || a.incidencia)) return false;
    if (filtro === 'incidencias' && !a.incidencia) return false;
    if (!q) return true;
    return (e.id + ' ' + JSON.stringify(e.campos)).toLowerCase().includes(q);
  });

  /* Un envío está «activo» mientras no esté entregado y sin problemas. Las
     incidencias también son activas: son las que más urge mirar, así que van
     arriba del todo dentro de su grupo. */
  const activo = e => { const a = analizarEstado(e.campos.estado); return a.incidencia || a.paso !== 3; };
  const pesoUrgencia = e => analizarEstado(e.campos.estado).incidencia ? 0 : 1;
  const activos = visibles.filter(activo).sort((a, b) => pesoUrgencia(a) - pesoUrgencia(b));
  const cerrados = visibles.filter(e => !activo(e));

  const historialDe = id => eventos.filter(ev => ev.envio_id === id);
  const rejilla = lista => (
    <div className="rejilla">
      {lista.map(e => <TarjetaEnvio key={e.id} envio={e} historial={historialDe(e.id)} />)}
    </div>
  );
  /* ¿Están los datos al día? La respuesta depende de la hora: a las once de la
     noche es normal que la última comprobación sea de las 17:30, pero a media
     mañana eso significa que algo se ha roto. El monitor estuvo un viernes
     entero sin comprobar nada —GitHub dejó de disparar el cron— y no se notó
     hasta días después, así que ahora el panel lo canta. */
  const desfase = meta.ultima_comprobacion
    ? Math.round((Date.now() - new Date(meta.ultima_comprobacion)) / 60000) : null;
  const enHorario = (() => {
    const ahora = new Date(new Date().toLocaleString('en-US', {timeZone: 'Europe/Madrid'}));
    const dia = ahora.getDay(), reloj = ahora.getHours() * 60 + ahora.getMinutes();
    return dia >= 1 && dia <= 5 && reloj >= 510 && reloj <= 1080;
  })();
  // En horario laboral se comprueba como mucho cada hora: pasada hora y media
  // sin noticias, algo va mal. Fuera de horario, basta con que sea de hoy.
  const margen = enHorario ? 90 : 20 * 60;
  const frescura = desfase !== null && desfase <= margen;
  const paradoEnHorario = enHorario && desfase !== null && desfase > margen;

  // Las cifras de la barra van sobre TODOS los envíos, no sobre los filtrados:
  // son la foto general, y cambiarlas al buscar despistaba.
  const resumen = envios.reduce((acc, e) => {
    const a = analizarEstado(e.campos.estado);
    if (a.incidencia) acc.incidencias++;
    else if (a.paso === 3) acc.entregados++;
    if (a.incidencia || a.paso !== 3) acc.activos++;
    return acc;
  }, {activos: 0, entregados: 0, incidencias: 0});

  return (
    <Fragment>
      <header className="barra">
        <div className="barra-int">
          <div className="marca-app">
            <img src="icono.svg" alt="" />
            <h1>ShipmentMonitor</h1>
          </div>
          <div className="tira">
            <span className="dato-tira"><b>{resumen.activos}</b> activos</span>
            <span className="sep">·</span>
            <span className="dato-tira" style={{color: resumen.incidencias ? 'var(--error)' : undefined}}>
              <b>{resumen.incidencias}</b> incid.
            </span>
            <span className="sep">·</span>
            <span className="dato-tira"><b>{resumen.entregados}</b> entregados</span>
          </div>
          <div className="crece" />
          <div className="acciones">
            <span className={'chip ' + (frescura ? 'on' : 'alerta')}>
              {haceCuanto(meta.ultima_comprobacion)}
            </span>
            <button className="btn primario" onClick={onRecargar} disabled={recargando}>
              {recargando ? 'Actualizando…' : 'Actualizar'}
            </button>
            <button className="btn" onClick={onSalir} title="Olvidar la contraseña en este dispositivo">Salir</button>
          </div>
        </div>
      </header>

      <main className="contenido">
        {meta.error && <div className="aviso mal">⚠ La última comprobación falló: {meta.error}</div>}

        {paradoEnHorario && (
          <div className="aviso mal">
            ⚠ <b>El monitor lleva {haceCuanto(meta.ultima_comprobacion).replace('hace ', '')} sin comprobar el portal</b>,
            y a esta hora debería hacerlo cada hora como mucho. Puede que GitHub haya dejado de
            lanzar las comprobaciones programadas.{' '}
            {meta.repo && (
              <a className="enlace" target="_blank" rel="noopener"
                 href={`https://github.com/${meta.repo}/actions/workflows/monitor.yml`}>
                Míralo en Actions y lánzala a mano
              </a>
            )}
          </div>
        )}

        {/* La tarjeta de avisos solo aparece cuando hay algo que hacer con ella */}
        <AvisosPush repo={meta.repo} meta={meta} />

        <div className="filtros">
          <div className="chips-filtro">
            {[['todos','Todos'],['curso','En curso'],['entregados','Entregados'],['incidencias','Incidencias']].map(([k,l]) => (
              <button key={k} className={'filtro-btn' + (filtro === k ? ' activo' : '')} onClick={()=>setFiltro(k)}>{l}</button>
            ))}
          </div>
          <div className="buscador">
            <input type="search" value={busqueda} onChange={e=>setBusqueda(e.target.value)}
                   placeholder="Buscar referencia, destinatario, localidad…" aria-label="Buscar" />
          </div>
        </div>

        {/* 1º — los que siguen en movimiento: siempre abiertos y los primeros */}
        <Seccion titulo="Envíos activos" cuenta={activos.length} primaria plegable={false}>
          {activos.length === 0
            ? <div className="tarjeta pad vacio">
                {visibles.length ? 'Ninguno en movimiento ahora mismo.' : 'No hay envíos que coincidan.'}
              </div>
            : rejilla(activos)}
        </Seccion>

        {/* 2º — los ya cerrados: presentes, pero sin robar sitio */}
        {cerrados.length > 0 && (
          <Seccion titulo="Entregados" cuenta={cerrados.length} abiertaPorDefecto={activos.length === 0}>
            {rejilla(cerrados)}
          </Seccion>
        )}

        {/* 3º — el resto, plegado */}
        <Seccion titulo="Novedades" cuenta={eventos.length} abiertaPorDefecto={false}>
          <Novedades eventos={eventos} />
        </Seccion>

        <Seccion titulo="Avisos y estado" abiertaPorDefecto={false}>
          <div className="tarjeta pad" style={{display:'grid', gap:'var(--sp-4)'}}>
            <Metricas meta={meta} envios={envios} />
            <PruebaAvisos meta={meta} />
          </div>
        </Seccion>
      </main>

      <footer className="pie-app">
        <span>Lunes a viernes · cada 15 min de 8:30 a 10:30, y cada hora hasta las 17:30</span>
        {meta.repo && <a className="enlace" href={`https://github.com/${meta.repo}/actions`} target="_blank" rel="noopener">Ver ejecuciones</a>}
        <span>Avisos: {Object.entries(meta.canales || {}).filter(([,v])=>v)
          .map(([k]) => ({push:'push al dispositivo', telegram:'Telegram', email:'email'}[k] || k))
          .join(', ') || 'solo en pantalla'}</span>
      </footer>
    </Fragment>
  );
}

/* ─────────────────── app ─────────────────── */
function App(){
  const [clave, setClave] = useState(() => leer(CLAVE_GUARDADA) || '');
  const [datos, setDatos] = useState(null);
  const [error, setError] = useState('');
  const [recargando, setRecargando] = useState(false);
  const primeraCarga = useRef(true);

  const recargar = useCallback(async (password) => {
    const pw = password ?? clave;
    if (!pw && !primeraCarga.current) return;
    setRecargando(true);
    try{
      setDatos(await cargarDatos(pw));
      setError('');
    }catch(err){
      if (err.clave){ olvidar(CLAVE_GUARDADA); setClave(''); setDatos(null); }
      else setError(err.message);
    }finally{ setRecargando(false); primeraCarga.current = false; }
  }, [clave]);

  useEffect(() => {
    if (!clave) return;
    recargar(clave);
    const t = setInterval(() => recargar(clave), 5 * 60 * 1000);   // el workflow va cada 15 min / cada hora en horario laboral
    return () => clearInterval(t);
  }, [clave, recargar]);

  const entrar = (password, datosIniciales) => { setClave(password); setDatos(datosIniciales); };
  const salir  = () => { olvidar(CLAVE_GUARDADA); setClave(''); setDatos(null); };

  if (!clave || !datos) {
    return (
      <Fragment>
        <Acceso onEntrar={entrar} />
        {error && <div className="contenido"><div className="aviso mal">{error}</div></div>}
      </Fragment>
    );
  }
  return <Panel datos={datos} onRecargar={() => recargar()} onSalir={salir} recargando={recargando} />;
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
ReactDOM.createRoot(document.getElementById('app')).render(<App />);
// Ya hay algo que enseñar: la pantalla de arranque se va (nunca antes de 1 s).
requestAnimationFrame(() => window.cerrarArranque && window.cerrarArranque());
</script>
</body>
</html>
