# ─────────────────────────────────────────────────────────────────────────────
# OJO: este fichero SOLO se ejecuta si esta carpeta (monitor-envios-nube) es la
# raíz del repositorio. Dentro de SHIPMENTMONITOR está anidada, y GitHub ignora
# los workflows que no cuelgan de la raíz: allí manda /.github/workflows/monitor.yml.
# ─────────────────────────────────────────────────────────────────────────────
name: Monitor de envíos

on:
  schedule:
    # Cada hora. GitHub ejecuta los cron "cuando puede": puede retrasarse unos
    # minutos en horas punta, que para vigilar envíos da igual.
    - cron: '0 * * * *'
  workflow_dispatch:        # botón "Run workflow" para forzar una comprobación

permissions:
  contents: write           # necesario para guardar docs/datos.json en el repo

concurrency:
  group: monitor-envios     # nunca dos comprobaciones a la vez
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # Por defecto, checkout se queda en el commit que disparó la ejecución.
          # Aquí eso no vale: si dos comprobaciones se disparan seguidas, la
          # segunda se traería una foto anterior a los datos que guardó la
          # primera, volvería a dar por nuevos envíos ya avisados y chocaría al
          # subir. Queremos siempre la punta de la rama.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Consultar el portal
        id: consulta
        continue-on-error: true      # aunque falle, queremos guardar el estado y los avisos
        env:
          DINAPAQ_USUARIO:       ${{ secrets.DINAPAQ_USUARIO }}
          DINAPAQ_AGENCIA:       ${{ secrets.DINAPAQ_AGENCIA }}
          DINAPAQ_CLIENTE:       ${{ secrets.DINAPAQ_CLIENTE }}
          DINAPAQ_PASSWORD:      ${{ secrets.DINAPAQ_PASSWORD }}
          DINAPAQ_URL_LOGIN:     ${{ vars.DINAPAQ_URL_LOGIN }}
          DINAPAQ_URL_LISTADO:   ${{ vars.DINAPAQ_URL_LISTADO }}
          DINAPAQ_DIAS_ATRAS:    ${{ vars.DINAPAQ_DIAS_ATRAS }}
          DINAPAQ_SEL_USUARIO:   ${{ vars.DINAPAQ_SEL_USUARIO }}
          DINAPAQ_SEL_CLIENTE:   ${{ vars.DINAPAQ_SEL_CLIENTE }}
          DINAPAQ_SEL_PASSWORD:  ${{ vars.DINAPAQ_SEL_PASSWORD }}
          CLAVE_PANEL:           ${{ secrets.CLAVE_PANEL }}
          # Avisos push directos al dispositivo (canal principal)
          VAPID_PRIVADA:         ${{ secrets.VAPID_PRIVADA }}
          VAPID_CONTACTO:        ${{ secrets.VAPID_CONTACTO }}
          PUSH_SUSCRIPCIONES:    ${{ secrets.PUSH_SUSCRIPCIONES }}
          # Refuerzos opcionales: si no existen los Secrets, ni se intentan
          TELEGRAM_TOKEN:        ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST:             ${{ secrets.SMTP_HOST }}
          SMTP_PUERTO:           ${{ secrets.SMTP_PUERTO }}
          SMTP_USUARIO:          ${{ secrets.SMTP_USUARIO }}
          SMTP_PASSWORD:         ${{ secrets.SMTP_PASSWORD }}
          EMAIL_DESTINO:         ${{ secrets.EMAIL_DESTINO }}
        run: python -m monitor.ejecutar

      - name: Guardar los datos en el repositorio
        run: |
          git config user.name  "monitor-envios"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f docs/datos.json ]; then
            echo "No se generó docs/datos.json; mira el paso anterior."
            exit 0
          fi
          # datos.json es un volcado generado, no código: fusionarlo línea a
          # línea no tiene sentido y acaba en un conflicto add/add en cuanto dos
          # ejecuciones se solapan. En vez de rebasar, nos colocamos sobre la
          # punta remota y escribimos nuestra versión encima, que es la lectura
          # más reciente del portal. El bucle cubre que alguien nos adelante
          # entre el fetch y el push.
          for intento in 1 2 3; do
            git fetch --quiet origin \
              "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"

            # --mixed mueve HEAD y el índice a la punta remota SIN tocar el
            # directorio de trabajo, así que nuestro datos.json sigue intacto.
            # Y como después solo añadimos ese fichero, no revertimos nada de
            # lo que hayan subido los demás.
            git reset --quiet --mixed "origin/${GITHUB_REF_NAME}"

            git add -f docs/datos.json
            if git diff --staged --quiet; then
              echo "Sin cambios que guardar."
              exit 0
            fi

            git commit --quiet -m "datos: $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Datos guardados."
              exit 0
            fi
            echo "Otra ejecución se adelantó; reintento ${intento} de 3."
          done
          echo "::error::No se pudieron guardar los datos tras 3 intentos."
          exit 1

      - name: Guardar capturas si el portal no se reconoció
        if: always() && hashFiles('capturas/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: capturas-${{ github.run_id }}
          path: capturas/
          retention-days: 7

      - name: Marcar la ejecución como fallida si no se pudo consultar
        if: steps.consulta.outcome == 'failure'
        run: |
          echo "::error::La comprobación falló; revisa el log del paso «Consultar el portal»."
          exit 1
