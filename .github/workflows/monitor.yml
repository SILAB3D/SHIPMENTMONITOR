# ─────────────────────────────────────────────────────────────────────────────
# Monitor de envíos — workflow del repositorio SHIPMENTMONITOR
#
# IMPORTANTE: GitHub SOLO lee los workflows que están en .github/workflows/ EN LA
# RAÍZ del repositorio. La copia que hay en
# monitor-envios-github/monitor-envios-nube/.github/workflows/ nunca se ejecuta:
# está ahí para quien prefiera sacar ese subdirectorio a un repositorio propio.
# Este fichero es el que manda aquí, y por eso entra en la carpeta del proyecto
# con `working-directory`.
# ─────────────────────────────────────────────────────────────────────────────
name: Monitor de envíos

on:
  schedule:
    # UNA sola línea de cron, a propósito. Aquí hubo cuatro, una por franja y
    # con listas de minutos, y GitHub las despachó UNA VEZ AL DÍA CADA UNA, a
    # horas cualesquiera de la tarde: de las 16 comprobaciones previstas para el
    # viernes 28 no se hizo ninguna, y el fallo fue mudo porque el filtro
    # horario las descartaba con toda la razón. Con una sola expresión sencilla
    # —la forma que llevaba semanas funcionando— el planificador se porta.
    #
    # Dispara cada cuarto de hora entre las 6:00 y las 16:59 UTC, que cubre de
    # sobra la jornada española en verano y en invierno. Cuáles de esos disparos
    # se convierten en comprobación lo decide el paso «¿Toca comprobar ahora?»,
    # mirando el reloj de Madrid y cuánto hace de la última. GitHub retrasa y se
    # salta ejecuciones cuando va cargado, así que el horario no puede depender
    # de que un disparo concreto llegue puntual: depende del hueco desde la
    # anterior, y un disparo perdido se arregla solo en el siguiente.
    - cron: '*/15 6-16 * * 1-5'
  workflow_dispatch:        # botón "Run workflow" para forzar una comprobación
    inputs:
      probar_avisos:
        description: 'Enviar solo un aviso de prueba por cada canal configurado (no consulta el portal)'
        type: boolean
        default: false

permissions:
  contents: write           # guardar docs/datos.json en el repositorio
  pages: write              # publicar el panel en GitHub Pages
  id-token: write           # lo exige actions/deploy-pages

concurrency:
  group: monitor-envios     # nunca dos comprobaciones a la vez
  cancel-in-progress: false


defaults:
  run:
    working-directory: monitor-envios-github/monitor-envios-nube

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}

    steps:
      # El checkout va lo primero porque para decidir si toca comprobar hay que
      # saber cuánto hace de la última, y eso lo dice el fichero de datos. Son
      # dos segundos; el resto del job sigue sin correr si no tocaba.
      - uses: actions/checkout@v4
        with:
          # Por defecto, checkout se queda en el commit que disparó la ejecución.
          # Aquí eso no vale: si dos comprobaciones se disparan seguidas, la
          # segunda se traería una foto anterior a los datos que guardó la
          # primera, volvería a dar por nuevos envíos ya avisados y chocaría al
          # subir. Queremos siempre la punta de la rama.
          ref: ${{ github.ref_name }}

      # La regla del horario vive en herramientas/toca_comprobar.sh, no aquí:
      # metida en el workflow no había forma de probarla, y ya falló una vez en
      # silencio. Ahora tiene sus propias pruebas en tests/test_horario.py.
      - name: ¿Toca comprobar ahora?
        id: horario
        run: bash herramientas/toca_comprobar.sh
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - uses: actions/setup-python@v5
        if: steps.horario.outputs.toca == 'si'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: monitor-envios-github/monitor-envios-nube/requirements.txt

      # El monitor habla con el portal por HTTP (ver monitor/scraper.py): ya no
      # hace falta instalar Chromium en cada ejecucion, que era lo mas lento de
      # todo el workflow.
      - name: Instalar dependencias
        if: steps.horario.outputs.toca == 'si'
        run: pip install -r requirements.txt

      # ── Modo prueba: solo comprueba que el aviso llega al móvil ──
      - name: Enviar un aviso de prueba por cada canal
        if: steps.horario.outputs.toca == 'si' && inputs.probar_avisos
        env:
          VAPID_PRIVADA:      ${{ secrets.VAPID_PRIVADA }}
          VAPID_CONTACTO:     ${{ secrets.VAPID_CONTACTO }}
          PUSH_SUSCRIPCIONES: ${{ secrets.PUSH_SUSCRIPCIONES }}
          TELEGRAM_TOKEN:     ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST:          ${{ secrets.SMTP_HOST }}
          SMTP_PUERTO:        ${{ secrets.SMTP_PUERTO }}
          SMTP_USUARIO:       ${{ secrets.SMTP_USUARIO }}
          SMTP_PASSWORD:      ${{ secrets.SMTP_PASSWORD }}
          EMAIL_DESTINO:      ${{ secrets.EMAIL_DESTINO }}
        run: python -m monitor.ejecutar --probar-avisos

      # ── Modo normal ──
      - name: Consultar el portal
        id: consulta
        if: steps.horario.outputs.toca == 'si' && !inputs.probar_avisos
        continue-on-error: true      # aunque falle, queremos guardar el estado y los avisos
        env:
          DINAPAQ_USUARIO:       ${{ secrets.DINAPAQ_USUARIO }}
          DINAPAQ_AGENCIA:       ${{ secrets.DINAPAQ_AGENCIA }}
          DINAPAQ_CLIENTE:       ${{ secrets.DINAPAQ_CLIENTE }}
          DINAPAQ_PASSWORD:      ${{ secrets.DINAPAQ_PASSWORD }}
          DINAPAQ_URL_LOGIN:     ${{ vars.DINAPAQ_URL_LOGIN }}
          DINAPAQ_URL_LISTADO:   ${{ vars.DINAPAQ_URL_LISTADO }}
          DINAPAQ_DIAS_ATRAS:    ${{ vars.DINAPAQ_DIAS_ATRAS }}
          DINAPAQ_SEL_USUARIO:   ${{ vars.DINAPAQ_SEL_USUARIO }}
          DINAPAQ_SEL_CLIENTE:   ${{ vars.DINAPAQ_SEL_CLIENTE }}
          DINAPAQ_SEL_PASSWORD:  ${{ vars.DINAPAQ_SEL_PASSWORD }}
          CLAVE_PANEL:           ${{ secrets.CLAVE_PANEL }}
          # Avisos push directos al dispositivo (canal principal)
          VAPID_PRIVADA:         ${{ secrets.VAPID_PRIVADA }}
          VAPID_CONTACTO:        ${{ secrets.VAPID_CONTACTO }}
          PUSH_SUSCRIPCIONES:    ${{ secrets.PUSH_SUSCRIPCIONES }}
          # Refuerzos opcionales: si no existen los Secrets, ni se intentan
          TELEGRAM_TOKEN:        ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST:             ${{ secrets.SMTP_HOST }}
          SMTP_PUERTO:           ${{ secrets.SMTP_PUERTO }}
          SMTP_USUARIO:          ${{ secrets.SMTP_USUARIO }}
          SMTP_PASSWORD:         ${{ secrets.SMTP_PASSWORD }}
          EMAIL_DESTINO:         ${{ secrets.EMAIL_DESTINO }}
        run: python -m monitor.ejecutar

      - name: Guardar los datos en el repositorio
        if: steps.horario.outputs.toca == 'si' && !inputs.probar_avisos
        run: |
          git config user.name  "monitor-envios"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f docs/datos.json ]; then
            echo "No se generó docs/datos.json; mira el paso anterior."
            exit 0
          fi
          # datos.json es un volcado generado, no código: fusionarlo línea a
          # línea no tiene sentido y acaba en un conflicto add/add en cuanto dos
          # ejecuciones se solapan. En vez de rebasar, nos colocamos sobre la
          # punta remota y escribimos nuestra versión encima, que es la lectura
          # más reciente del portal. El bucle cubre que alguien nos adelante
          # entre el fetch y el push.
          for intento in 1 2 3; do
            git fetch --quiet origin \
              "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"

            # --mixed mueve HEAD y el índice a la punta remota SIN tocar el
            # directorio de trabajo, así que nuestro datos.json sigue intacto.
            # Y como después solo añadimos ese fichero, no revertimos nada de
            # lo que hayan subido los demás.
            git reset --quiet --mixed "origin/${GITHUB_REF_NAME}"

            # -f a propósito: el .gitignore de la raíz esconde este fichero para
            # que los datos de demostración generados en local no se suban por
            # descuido. Aquí, en cambio, es justo lo que hay que guardar: es la
            # memoria del monitor entre una ejecución y la siguiente.
            git add -f docs/datos.json
            if git diff --staged --quiet; then
              echo "Sin cambios que guardar."
              exit 0
            fi

            git commit --quiet -m "datos: $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Datos guardados."
              exit 0
            fi
            echo "Otra ejecución se adelantó; reintento ${intento} de 3."
          done
          echo "::error::No se pudieron guardar los datos tras 3 intentos."
          exit 1

      # ── Publicar el panel en GitHub Pages ──
      # Requiere Settings → Pages → Source = "GitHub Actions". Si no lo has
      # puesto todavía, estos pasos avisan pero no tumban la comprobación.
      - name: Preparar Pages
        if: steps.horario.outputs.toca == 'si' && !inputs.probar_avisos
        id: configurar-pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Empaquetar el panel
        if: "steps.horario.outputs.toca == 'si' && !inputs.probar_avisos && steps.configurar-pages.outcome == 'success'"
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: monitor-envios-github/monitor-envios-nube/docs

      - name: Publicar el panel
        if: "steps.horario.outputs.toca == 'si' && !inputs.probar_avisos && steps.configurar-pages.outcome == 'success'"
        id: pages
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Marcar la ejecución como fallida si no se pudo consultar
        if: steps.consulta.outcome == 'failure'
        run: |
          echo "::error::La comprobación falló; revisa el log del paso «Consultar el portal»."
          exit 1
