# ─────────────────────────────────────────────────────────────────────────────
# Monitor de envíos — workflow del repositorio SHIPMENTMONITOR
#
# IMPORTANTE: GitHub SOLO lee los workflows que están en .github/workflows/ EN LA
# RAÍZ del repositorio. La copia que hay en
# monitor-envios-github/monitor-envios-nube/.github/workflows/ nunca se ejecuta:
# está ahí para quien prefiera sacar ese subdirectorio a un repositorio propio.
# Este fichero es el que manda aquí, y por eso entra en la carpeta del proyecto
# con `working-directory`.
# ─────────────────────────────────────────────────────────────────────────────
name: Monitor de envíos

on:
  schedule:
    # El cron ya no marca el ritmo: solo ARRANCA la jornada. Lo hace así porque
    # GitHub dejó de cumplirlo —de las comprobaciones pedidas servía entre una y
    # cuatro al día, a la hora que le parecía, se le pidieran 12 o 44—, y eso no
    # lo arregla ninguna expresión de cron. La vigilancia de verdad la lleva
    # herramientas/vigilar.sh, que se queda despierto y comprueba él mismo cada
    # 15 min hasta las 10:30 y cada hora hasta las 17:30.
    #
    # Se piden muchos disparos para que alguno caiga: con UNO por la mañana el
    # día queda cubierto. Los que lleguen mientras hay una jornada en marcha se
    # encolan (lo garantiza `concurrency`) y continúan cuando la anterior agota
    # su tope de horas. Van al minuto :07 y :37 porque GitHub retrasa más los
    # disparos que caen en punto.
    - cron: '7,37 6-16 * * 1-5'
  workflow_dispatch:        # botón "Run workflow" para forzar una comprobación
    inputs:
      probar_avisos:
        description: 'Enviar solo un aviso de prueba por cada canal configurado (no consulta el portal)'
        type: boolean
        default: false

permissions:
  contents: write           # guardar docs/datos.json en el repositorio
  pages: write              # publicar el panel en GitHub Pages
  id-token: write           # lo exige actions/deploy-pages

concurrency:
  group: monitor-envios     # nunca dos comprobaciones a la vez
  cancel-in-progress: false


defaults:
  run:
    working-directory: monitor-envios-github/monitor-envios-nube

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 350      # la jornada de vigilancia dura horas, no minutos
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}

    steps:
      # El checkout va lo primero porque para decidir si toca comprobar hay que
      # saber cuánto hace de la última, y eso lo dice el fichero de datos. Son
      # dos segundos; el resto del job sigue sin correr si no tocaba.
      - uses: actions/checkout@v4
        with:
          # Por defecto, checkout se queda en el commit que disparó la ejecución.
          # Aquí eso no vale: si dos comprobaciones se disparan seguidas, la
          # segunda se traería una foto anterior a los datos que guardó la
          # primera, volvería a dar por nuevos envíos ya avisados y chocaría al
          # subir. Queremos siempre la punta de la rama.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: monitor-envios-github/monitor-envios-nube/requirements.txt

      # El monitor habla con el portal por HTTP (ver monitor/scraper.py): ya no
      # hace falta instalar Chromium en cada ejecucion, que era lo mas lento de
      # todo el workflow.
      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # ── Modo prueba: solo comprueba que el aviso llega al móvil ──
      - name: Enviar un aviso de prueba por cada canal
        if: ${{ inputs.probar_avisos }}
        env:
          VAPID_PRIVADA:      ${{ secrets.VAPID_PRIVADA }}
          VAPID_CONTACTO:     ${{ secrets.VAPID_CONTACTO }}
          PUSH_SUSCRIPCIONES: ${{ secrets.PUSH_SUSCRIPCIONES }}
          TELEGRAM_TOKEN:     ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST:          ${{ secrets.SMTP_HOST }}
          SMTP_PUERTO:        ${{ secrets.SMTP_PUERTO }}
          SMTP_USUARIO:       ${{ secrets.SMTP_USUARIO }}
          SMTP_PASSWORD:      ${{ secrets.SMTP_PASSWORD }}
          EMAIL_DESTINO:      ${{ secrets.EMAIL_DESTINO }}
        run: python -m monitor.ejecutar --probar-avisos

      # ── Modo normal: la jornada de vigilancia ──
      # Una sola ejecución cubre horas: comprueba el portal, guarda y avisa, se
      # duerme hasta la siguiente y vuelve. El porqué, en herramientas/vigilar.sh.
      - name: Vigilar el portal durante la jornada
        id: vigilancia
        if: ${{ !inputs.probar_avisos }}
        env:
          DINAPAQ_USUARIO:       ${{ secrets.DINAPAQ_USUARIO }}
          DINAPAQ_AGENCIA:       ${{ secrets.DINAPAQ_AGENCIA }}
          DINAPAQ_CLIENTE:       ${{ secrets.DINAPAQ_CLIENTE }}
          DINAPAQ_PASSWORD:      ${{ secrets.DINAPAQ_PASSWORD }}
          DINAPAQ_URL_LOGIN:     ${{ vars.DINAPAQ_URL_LOGIN }}
          DINAPAQ_URL_LISTADO:   ${{ vars.DINAPAQ_URL_LISTADO }}
          DINAPAQ_DIAS_ATRAS:    ${{ vars.DINAPAQ_DIAS_ATRAS }}
          DINAPAQ_SEL_USUARIO:   ${{ vars.DINAPAQ_SEL_USUARIO }}
          DINAPAQ_SEL_CLIENTE:   ${{ vars.DINAPAQ_SEL_CLIENTE }}
          DINAPAQ_SEL_PASSWORD:  ${{ vars.DINAPAQ_SEL_PASSWORD }}
          CLAVE_PANEL:           ${{ secrets.CLAVE_PANEL }}
          # Avisos push directos al dispositivo (canal principal)
          VAPID_PRIVADA:         ${{ secrets.VAPID_PRIVADA }}
          VAPID_CONTACTO:        ${{ secrets.VAPID_CONTACTO }}
          PUSH_SUSCRIPCIONES:    ${{ secrets.PUSH_SUSCRIPCIONES }}
          # Refuerzos opcionales: si no existen los Secrets, ni se intentan
          TELEGRAM_TOKEN:        ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST:             ${{ secrets.SMTP_HOST }}
          SMTP_PUERTO:           ${{ secrets.SMTP_PUERTO }}
          SMTP_USUARIO:          ${{ secrets.SMTP_USUARIO }}
          SMTP_PASSWORD:         ${{ secrets.SMTP_PASSWORD }}
          EMAIL_DESTINO:         ${{ secrets.EMAIL_DESTINO }}
        run: |
          git config user.name  "monitor-envios"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash herramientas/vigilar.sh

      # ── Publicar el panel en GitHub Pages ──
      # Requiere Settings → Pages → Source = "GitHub Actions". Si no lo has
      # puesto todavía, estos pasos avisan pero no tumban la comprobación.
      - name: Preparar Pages
        if: ${{ !inputs.probar_avisos && steps.vigilancia.outputs.comprobaciones != '0' }}
        id: configurar-pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Empaquetar el panel
        if: "!inputs.probar_avisos && steps.configurar-pages.outcome == 'success'"
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: monitor-envios-github/monitor-envios-nube/docs

      - name: Publicar el panel
        if: "!inputs.probar_avisos && steps.configurar-pages.outcome == 'success'"
        id: pages
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # Una comprobación suelta puede fallar y recuperarse en la siguiente; eso
      # no merece un rojo. Lo que sí lo merece es cerrar la jornada sin poder
      # leer el portal, que es cuando hay algo roto de verdad.
      - name: Marcar la ejecución como fallida si el portal quedó ilegible
        if: steps.vigilancia.outputs.fallos != '' && steps.vigilancia.outputs.fallos != '0'
        run: |
          echo "::error::La jornada terminó con ${{ steps.vigilancia.outputs.fallos }} comprobación(es) seguidas fallando; revisa el log."
          exit 1
